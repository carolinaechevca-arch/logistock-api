spring:
  datasource:
    url: jdbc:h2:mem:logistock;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory
    open-in-view: false
  flyway:
    enabled: true
    create-schemas: true
    default-schema: inventory
    schemas: inventory
