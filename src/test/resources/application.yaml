spring:
  datasource:
    url: jdbc:h2:mem:logistock;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_schema: inventory
        hbm2ddl:
          create_namespaces: true
    open-in-view: false
