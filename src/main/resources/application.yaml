spring:
  application:
    name: inventory
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: inventory
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
