spring:
  application:
    name: inventory
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory
    open-in-view: false
  flyway:
    enabled: true
    create-schemas: true
    default-schema: inventory
    schemas: inventory

springdoc:
  swagger-ui:
    path: /swagger-ui.html
