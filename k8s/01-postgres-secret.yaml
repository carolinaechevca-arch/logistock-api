# Credenciales de PostgreSQL. Las usan el contenedor de la base de datos y la API.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: practica2
  labels:
    app: postgres
    app.kubernetes.io/part-of: logistock
type: Opaque
stringData:
  POSTGRES_DB: logistock
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
