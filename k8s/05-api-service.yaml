# Expone la API fuera del clúster en http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: logistock-api-service
  namespace: practica2
  labels:
    app: logistock-api
    app.kubernetes.io/part-of: logistock
spec:
  type: NodePort
  selector:
    app: logistock-api      # envía el tráfico a los pods con label app=logistock-api
  ports:
    - name: http
      port: 80              # puerto del Service dentro del clúster
      targetPort: 8080      # puerto del contenedor (EXPOSE 8080)
      nodePort: 30080       # puerto publicado en el equipo (rango 30000-32767)
