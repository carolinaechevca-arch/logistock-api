plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.logistock'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testImplementation 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Etiqueta de trazabilidad: guarda dentro del .jar la ejecucion de CI y el commit
// que lo fabricaron. Azure Pipelines define BUILD_BUILDNUMBER y BUILD_SOURCEVERSION;
// fuera de la pipeline (en un equipo local) quedan como "local".
// /health muestra estos valores. Responsable: Juan Camilo Duarte Vasco.
springBoot {
	buildInfo {
		properties {
			additional = [
				'ciBuild': System.getenv('BUILD_BUILDNUMBER') ?: 'local',
				'commit' : System.getenv('BUILD_SOURCEVERSION') ?: 'local'
			]
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
